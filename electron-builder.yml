# Windows installer for the desktop app. Normally built on your PC by
# scripts/windows/install.ps1 ("Install Multi Twitch Viewer.cmd"); or: npm run desktop:dist
appId: com.dominicpasquarelli.multitwitchviewer
productName: Multi Twitch Viewer
copyright: Personal use
directories:
  output: release
  buildResources: desktop/assets
files:
  - dist/**
  - desktop/**
  - '!desktop/**/*.test.mjs'
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/assets/icon.png
  artifactName: MultiTwitchViewer-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Multi Twitch Viewer
  runAfterFinish: true
  deleteAppDataOnUninstall: false
