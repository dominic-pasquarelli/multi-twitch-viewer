name: Windows app

# Builds MultiTwitchViewer.exe and publishes it on the "Latest Windows app"
# release, so it can be downloaded from the repository's Releases page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache: false
      - run: npm ci
      - run: npm run test:launcher
      - run: npm run build:windows
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          notes="Download **MultiTwitchViewer.exe** and double-click it. Built from ${GITHUB_SHA::7}."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest Windows app" --notes "$notes" --latest
            gh release upload latest release/MultiTwitchViewer.exe --clobber
          else
            gh release create latest release/MultiTwitchViewer.exe --title "Latest Windows app" --notes "$notes" --latest
          fi
